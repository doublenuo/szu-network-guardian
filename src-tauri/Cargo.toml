[package]
name = "szu-network-guardian"
version = "1.2.2"
description = "SZU Network Guardian"
authors = ["SZU Network Guardian"]
edition = "2021"

[lib]
name = "szu_network_guardian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
